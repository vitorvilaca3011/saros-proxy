version: "3.9"

# Configuration precedence (loadConfig in src/config.ts):
# CLI args > config.yaml > environment variables > defaults.
# The mounted ./config.yaml below therefore wins over the env vars for every
# field it sets, including `keys`.
services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saros
    ports:
      - "3000:3000"
    # A published port is DNAT'ed to the container interface, so 127.0.0.1
    # inside would never see host traffic. YAML `host` beats PROXY_HOST, but
    # CLI args are applied last, so this is the override that works.
    volumes:
      # Mount config from host (create config.yaml from config.example.yaml first)
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - NODE_ENV=production
      # Env vars only fill fields the mounted config.yaml leaves unset (see the
      # precedence note at the top of this file).
      # - PROXY_PORT=3000
      # - PROXY_HOST=0.0.0.0
      # - UPSTREAM_BASE_URL=https://opencode.ai
      # - OPENCODE_GO_KEYS=label1:sk-xxx,label2:sk-yyy
      # - OPENCODE_GO_ENCRYPTION_KEY=your-master-key-here  # Required if keys are encrypted
      # - CIRCUIT_BREAKER_THRESHOLD=3
      # - CIRCUIT_BREAKER_COOLDOWN_MS=60000
      # - REQUEST_TIMEOUT_MS=30000
      # - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - saros-net

  # ── Test service ─────────────────────────────────────────────────────────
  # Runs the test suite inside a clean Linux container.
  # Usage: docker compose run --rm test
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: saros-test
    volumes:
      # Mount source so tests reflect current code without rebuild
      - ./src:/app/src:ro
      - ./test:/app/test:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    environment:
      - NODE_ENV=test
      - CI=true
    command: ["npx", "vitest", "run", "--reporter=verbose"]
    networks:
      - saros-net
    profiles:
      - test

networks:
  saros-net:
    driver: bridge
