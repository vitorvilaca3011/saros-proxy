name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Check & Build (shared) ────────────────────────────────────────────────
  check:
    name: Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v${tag_version} does not match package.json version ${pkg_version}"
            exit 1
          fi
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
      - name: Smoke test packed tarball
        run: |
          mkdir -p /tmp/smoke
          npm pack --pack-destination /tmp/smoke >/dev/null
          tarball="$(ls /tmp/smoke/saros-proxy-*.tgz | head -n1)"
          mkdir -p /tmp/smoke/install && cd /tmp/smoke/install
          npm init -y >/dev/null 2>&1
          npm install "$tarball" --no-audit --no-fund >/dev/null 2>&1
          node_modules/.bin/saros-proxy --version
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # ── Publish to npmjs.org ──────────────────────────────────────────────────
  publish-npm:
    name: Publish to npmjs.org
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC — enables npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish
        # --provenance disabled: with NODE_AUTH_TOKEN it fails with
        # `404 PUT registry.npmjs.org/<pkg>` after signing the statement
        # (signed to sigstore, but the token PUT is rejected). Re-enable
        # once publishing moves to OIDC-exclusive auth.
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Publish to GitHub Packages ────────────────────────────────────────────
  publish-github:
    name: Publish to GitHub Packages
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vitorvilaca3011'
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish
        run: |
          cp package.json package.json.bak
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@vitorvilaca3011/saros-proxy';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --access public --ignore-scripts
          mv package.json.bak package.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
