name: Models refresh

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One refresh at a time; a queued run replaces an older pending one instead
  # of stacking, and an in-flight run is never cancelled mid-push.
  group: models-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh models.dev catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Captured before the write so the pull-request body describes exactly
      # what regeneration changes. A failed fetch fails this step and stops the
      # job before assets/models.json is touched.
      - name: Render catalog diff
        run: npm run --silent models:refresh -- --dry-run > "$RUNNER_TEMP/models-refresh-diff.txt"

      - name: Regenerate catalog
        run: npm run --silent models:refresh

      - name: Check for changes
        id: drift
        run: |
          if git diff --quiet -- assets/models.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "assets/models.json is up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "assets/models.json changed"
          fi

      - name: Commit and push the refresh branch
        if: steps.drift.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/models-refresh
          git add assets/models.json
          git commit -m "chore(models): refresh catalog from models.dev"
          # Track the remote branch so --force-with-lease has a baseline. It
          # does not exist on the first run.
          git fetch --depth=1 origin "+refs/heads/chore/models-refresh:refs/remotes/origin/chore/models-refresh" || true
          git push --force-with-lease origin chore/models-refresh

      - name: Open the pull request when none is open
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A PR opened with GITHUB_TOKEN does not get reliable checks (the
        # pull_request run aborts at startup), so ci.yml ignores
        # assets/models.json on pull requests: the catalog is validated by the
        # suite that runs on master right after the merge.
        run: |
          body="$RUNNER_TEMP/models-refresh-pr.md"
          {
            echo "Automated refresh of \`assets/models.json\` from models.dev and the live provider catalogs."
            echo
            echo "Generated by the \`models-refresh\` workflow."
            echo
            echo "Merging this PR does not publish anything: the catalog reaches users in the next release/tag."
            echo
            echo '```text'
            cat "$RUNNER_TEMP/models-refresh-diff.txt"
            echo '```'
          } > "$body"

          if [ "$(gh pr list --head chore/models-refresh --json number --jq 'length')" -eq 0 ]; then
            gh pr create \
              --base master \
              --head chore/models-refresh \
              --title "chore(models): refresh catalog from models.dev" \
              --body-file "$body"
          else
            echo "PR for chore/models-refresh is already open; the push updated it"
          fi
